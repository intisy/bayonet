name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  packages: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      gradle_test: check
      gradle_args: -Dconformance.vectors=conformance/vectors
      extra_repository: weivel/conformance
      extra_path: conformance
    secrets:
      envPAT: ${{ secrets.PAT }}
