// TEMPORARY BY DESIGN, like the kernel's. It exists to measure where :engine cannot yet do the
// kernel's job, and it is deleted when there is nothing left to measure. Not in PUBLISHED_MODULES,
// so nothing publishes it.
dependencies {
    implementation project(":engine")
    // The JVM backing of the engine's Handles seam, which is what makes a revoked call fail here.
    implementation project(":jvm-seam")
    implementation "com.google.code.gson:gson:2.10.1"
}

// The runner spawns this as a plain command, so everything it needs is inside the one jar.
jar {
    manifest { attributes "Main-Class": "io.github.intisy.ai.conformance.BayonetDriver" }
    archiveFileName = "conformance-driver.jar"
    // Without this the task can run before the jars it unpacks exist: a `from` closure resolving a
    // configuration declares no dependency on what produces it, and locally it passes because the
    // producer happened to have run already.
    dependsOn configurations.runtimeClasspath
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/MANIFEST.MF"
}

// The corpus lives in another repository and is read at run time, so its path has to be handed to
// the FORKED test JVM: a -D on the Gradle command line reaches the daemon and stops there, which
// is measurable with a bogus path and was how this was found. Declared as an input for the reason
// RULES.md section 8 gives: a gate whose subject Gradle cannot see stays UP-TO-DATE and green.
tasks.named("test") {
    def corpus = System.getProperty("conformance.vectors")
    if (corpus != null) {
        // Resolved at the ROOT, so CI can name the sibling checkout the way it laid it out rather
        // than knowing where a test task happens to run from, which is the subproject directory.
        def vectors = rootProject.file(corpus)
        systemProperty "conformance.vectors", vectors.absolutePath
        if (vectors.isDirectory()) {
            inputs.dir vectors
        }
    }
}
