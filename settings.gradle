plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "bayonet-java"

// :annotations - the emission annotations. JDK 1.8, because :contract reads them at release 8.
// :processor   - the emitter. JDK 17, because javax.lang.model.SourceVersion.RELEASE_17 needs it.
// :contract    - the api meta-vocabulary, annotated and processed into TypeScript declarations.
include ":annotations"
include ":processor"
include ":contract"

// :engine  - the declaration engine: failure type, diagnostics, activation order, validation.
include ":engine"

// :seam    - portable implementations of the contract's seams. JDK 1.8 on both compile steps: it
//            touches no TeaVM api, so javac can enforce the rule here rather than the author.
// :js-base - the JSO bridges that back those seams with JavaScript. JDK 17, see its build script.
include ":seam"
include ":js-base"

// :jvm-seam - the JVM implementations of those same seams. JVM-only and never TeaVM-compiled,
//             so a JDK-only class like URLConnection or java.sql is fair game here.
include ":jvm-seam"

// :teavm - the engine compiled to an ES2015 module. JDK 17, because TeaVM 0.15.0's artifacts
//          publish minimum-JVM metadata above 8.
include ":teavm"
